<style>
:root{--green:#244c3b;--green2:#35644e;--sage:#e6ede5;--cream:#faf8f2;--paper:#fffefa;--ink:#26332b;--muted:#788078;--gold:#b99b61;--line:#e9e7df;--rose:#f4e8e2;--shadow:0 8px 28px #203b2b0a}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:'DM Sans',sans-serif;font-size:14px}button,input,select{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:flex}.sidebar{width:238px;background:var(--green);color:#f8f5ed;padding:28px 18px;display:flex;flex-direction:column;flex-shrink:0}.brand{font:600 27px 'Playfair Display',serif;letter-spacing:.2px;padding:0 12px 8px}.brand span{color:#d7bf8c}.tagline{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#c1d0c4;padding:0 12px 34px}.nav-label{color:#aabdb0;text-transform:uppercase;font-size:10px;letter-spacing:1.6px;padding:0 12px 12px}.nav{display:grid;gap:6px}.nav button{border:0;background:transparent;color:#d7e1d9;text-align:left;padding:12px;border-radius:10px;display:flex;align-items:center;gap:12px}.nav button:hover,.nav button.active{background:#ffffff18;color:#fff}.nav .ico{width:20px;text-align:center;font-size:16px}.side-bottom{margin-top:auto;padding:20px 12px 0;border-top:1px solid #ffffff25;color:#c1d0c4;font-size:12px;line-height:1.7}.side-bottom strong{color:white;font-weight:600}.main{flex:1;min-width:0}.topbar{height:76px;background:#fffefa;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 38px;gap:16px}.crumb{font-size:12px;color:var(--muted)}.crumb strong{color:var(--ink);font-weight:600}.top-actions{display:flex;align-items:center;gap:12px}.date-pill{border:1px solid var(--line);border-radius:30px;padding:9px 13px;color:#5f6a61;font-size:12px}.avatar{width:34px;height:34px;border-radius:50%;background:#e8d9bf;color:var(--green);display:grid;place-items:center;font-weight:700}.content{padding:34px 38px 50px;max-width:1420px;margin:auto}.eyebrow{text-transform:uppercase;letter-spacing:2px;font-size:10px;color:var(--gold);font-weight:700}.heading-row{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:24px}.h1{font:600 32px 'Playfair Display',serif;margin:7px 0 6px;letter-spacing:-.4px}.sub{color:var(--muted);font-size:13px;line-height:1.6}.btn{border:0;border-radius:9px;padding:11px 16px;font-size:12px;font-weight:700;transition:.2s}.btn-primary{background:var(--green);color:white}.btn-primary:hover{background:var(--green2)}.btn-light{background:var(--sage);color:var(--green)}.btn-outline{border:1px solid var(--line);background:white;color:var(--ink)}.grid{display:grid;gap:18px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:20px}.card{background:var(--paper);border:1px solid var(--line);border-radius:15px;padding:21px;box-shadow:var(--shadow);min-width:0}.stat-top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px}.stat-icon{width:34px;height:34px;border-radius:10px;background:var(--sage);display:grid;place-items:center;color:var(--green);font-size:16px}.stat-num{font:600 28px 'Playfair Display',serif;margin:15px 0 5px}.stat-foot{font-size:11px;color:var(--muted)}.positive{color:#4e8061}.dashboard-grid{grid-template-columns:minmax(0,1.5fr) minmax(280px,1fr)}.card-title{font:600 19px 'Playfair Display',serif;margin:0}.card-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:19px}.small-link{border:0;background:transparent;color:var(--green2);font-weight:700;font-size:12px}.progress-row{display:flex;justify-content:space-between;align-items:center;font-size:12px;margin:15px 0 9px}.progress{height:7px;background:#edf0e9;border-radius:99px;overflow:hidden}.progress span{display:block;height:100%;background:var(--green2);border-radius:99px;transition:width .3s}.budget-total{font:600 28px 'Playfair Display',serif;margin:8px 0}.budget-caption{color:var(--muted);font-size:12px}.budget-bar{display:flex;height:10px;border-radius:20px;overflow:hidden;margin:19px 0 15px;background:#eee}.legend{display:grid;grid-template-columns:1fr 1fr;gap:12px}.legend-item{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:7px}.dot{width:8px;height:8px;border-radius:3px;display:inline-block}.timeline{display:grid;gap:0}.task{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid #f0eee8}.task:last-child{border-bottom:0}.check{appearance:none;width:18px;height:18px;border:1.5px solid #c7d0c5;border-radius:5px;flex-shrink:0;margin:1px 0 0;cursor:pointer}.check:checked{background:var(--green);border-color:var(--green)}.check:checked:after{content:'✓';display:block;color:white;font-size:12px;text-align:center;line-height:16px}.task-name{font-weight:600;font-size:12px}.task-meta{font-size:11px;color:var(--muted);margin-top:4px}.task.done .task-name{text-decoration:line-through;color:#9aa39b}.task-tag{margin-left:auto;white-space:nowrap;font-size:10px;padding:5px 8px;background:#f3eee2;color:#8a7040;border-radius:6px}.task-tag.done-tag{background:var(--sage);color:var(--green)}.vendor-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.vendor-card{overflow:hidden;padding:0}.vendor-photo{height:140px;display:grid;place-items:center;font-size:42px;background:linear-gradient(135deg,#e7e8db,#d6dfd3);position:relative}.vendor-photo.rose{background:linear-gradient(135deg,#f2e1d9,#ead0c7)}.vendor-photo.gold{background:linear-gradient(135deg,#eee5ce,#d9c9a4)}.vendor-photo.blue{background:linear-gradient(135deg,#e2e8e5,#cad8d1)}.vendor-body{padding:16px}.vendor-type{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--gold);font-weight:700}.vendor-name{font:600 18px 'Playfair Display',serif;margin:6px 0}.vendor-location{font-size:11px;color:var(--muted)}.vendor-bottom{display:flex;justify-content:space-between;align-items:center;margin-top:14px;gap:10px}.price{font-size:12px;font-weight:700}.rating{font-size:11px;color:#8c7548}.filter-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}.filter{padding:9px 13px;border:1px solid var(--line);border-radius:30px;background:white;color:#687269;font-size:11px}.filter.active{background:var(--green);border-color:var(--green);color:white}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:7px}.field input,.field select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:white;outline:none}.field input:focus,.field select:focus{border-color:var(--green2)}.budget-table{width:100%;border-collapse:collapse;margin-top:8px}.budget-table th{text-align:left;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:1px;font-weight:600;padding:12px 8px;border-bottom:1px solid var(--line)}.budget-table td{padding:14px 8px;border-bottom:1px solid #f0eee8;font-size:12px}.budget-table input{width:95px;padding:8px;border:1px solid var(--line);border-radius:7px}.table-wrap{overflow-x:auto}.empty{padding:30px;text-align:center;color:var(--muted)}.toast{position:fixed;bottom:22px;right:22px;background:var(--green);color:white;padding:13px 18px;border-radius:10px;box-shadow:var(--shadow);display:none;z-index:5}.mobile-menu{display:none}.hero{background:var(--green);border-radius:16px;color:#fff;padding:26px 28px;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;gap:18px;position:relative;overflow:hidden}.hero:after{content:'✳';position:absolute;right:28%;top:-40px;font-size:160px;color:#ffffff0b}.hero .eyebrow{color:#d9c28f}.hero h2{font:600 25px 'Playfair Display',serif;margin:8px 0}.hero p{color:#d5e0d6;font-size:12px;margin:0;line-height:1.6}.hero-count{text-align:right;z-index:1}.hero-count strong{font:600 28px 'Playfair Display',serif;display:block}.hero-count span{font-size:11px;color:#d5e0d6}.page-note{font-size:11px;color:var(--muted);margin-top:15px}
@media(max-width:1050px){.sidebar{width:205px}.content{padding:26px 24px}.topbar{padding:0 24px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.vendor-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:720px){.app{display:block}.sidebar{position:fixed;z-index:10;left:-250px;top:0;bottom:0;width:238px;transition:left .25s;box-shadow:10px 0 30px #0002}.sidebar.open{left:0}.mobile-menu{display:inline-grid;place-items:center;border:1px solid var(--line);background:white;border-radius:8px;width:36px;height:36px}.topbar{height:64px;padding:0 16px}.date-pill{display:none}.content{padding:24px 15px 36px}.heading-row{align-items:flex-start;flex-direction:column}.h1{font-size:28px}.stats{gap:10px}.stats .card{padding:15px}.stat-num{font-size:24px}.dashboard-grid,.vendor-grid{grid-template-columns:1fr}.hero{padding:22px;align-items:flex-start}.hero-count{display:none}.form-grid{grid-template-columns:1fr}.budget-table th,.budget-table td{padding:11px 6px}.card{padding:17px}.top-actions{gap:8px}}
</style>

<body><div class="app">
<header class="topbar"><div class="brand">everly<span>.</span></div><div class="top-actions"><button class="date-pill" id="weddingDateButton" type="button" aria-label="Change wedding date">♡ &nbsp; <span id="weddingDateLabel">September 18, 2027</span> <span aria-hidden="true">⌄</span></button><div class="avatar">J</div></div></header>
<nav class="nav" id="nav" aria-label="Main navigation">
<button class="active" data-page="dashboard"><span class="ico">⌂</span>Home</button>
<button data-page="vendors"><span class="ico">✿</span>Discover</button>
<button data-page="checklist"><span class="ico">✓</span>My planning</button>
<button data-page="budget"><span class="ico">◈</span>Budget</button>
<button data-page="guests"><span class="ico">♧</span>Guests</button>
</nav>
<main class="main"><div class="content" id="content"></div></main></div><div class="toast" id="toast"></div>
<script>
const defaults={
 budget:35000,
 categories:[
 {name:'Venue & catering',planned:14000,actual:0,color:'#315e46'},
 {name:'Photography',planned:3200,actual:0,color:'#c0a36b'},
 {name:'Flowers & decor',planned:4200,actual:0,color:'#b7c7b3'},
 {name:'Attire & beauty',planned:2600,actual:0,color:'#d9b8a9'},
 {name:'Music & entertainment',planned:1800,actual:0,color:'#9daea4'},
 {name:'Other',planned:9200,actual:0,color:'#d9d6ca'}],
 tasks:[
 {name:'Set your wedding budget',meta:'Planning essentials',done:true,tag:'Completed'},
 {name:'Choose your wedding venue',meta:'Venue & location',done:true,tag:'High priority'},
 {name:'Book your photographer',meta:'Photo & video',done:false,tag:'High priority'},
 {name:'Finalize guest list',meta:'Guests & invitations',done:false,tag:'This month'},
 {name:'Meet with florists',meta:'Flowers & decor',done:false,tag:'Upcoming'},
 {name:'Choose wedding attire',meta:'Attire & beauty',done:false,tag:'Upcoming'},
 {name:'Book music & entertainment',meta:'Music & entertainment',done:false,tag:'Upcoming'},
 {name:'Send save-the-dates',meta:'Guests & invitations',done:false,tag:'Upcoming'}],
 vendors:[
 {name:'Olive Grove Estate',type:'Venue',location:'Batroun, Lebanon',price:9500,rating:'4.9',icon:'⌂',color:'',desc:'A romantic garden venue with mountain views.'},
 {name:'Lumière Photography',type:'Photography',location:'Beirut, Lebanon',price:1800,rating:'5.0',icon:'◎',color:'rose',desc:'Editorial wedding photography, naturally captured.'},
 {name:'Wildflower Studio',type:'Florist & decor',location:'Jounieh, Lebanon',price:1400,rating:'4.8',icon:'✿',color:'gold',desc:'Seasonal florals and thoughtful tablescapes.'},
 {name:'The Cedar Band',type:'Music',location:'Beirut, Lebanon',price:1200,rating:'4.9',icon:'♫',color:'blue',desc:'Live music to keep your dance floor full.'},
 {name:'Maison Blanc',type:'Bridal attire',location:'Dbayeh, Lebanon',price:2200,rating:'4.7',icon:'✧',color:'rose',desc:'Modern bridal looks and personal styling.'},
 {name:'Sweet Atelier',type:'Cake & desserts',location:'Antelias, Lebanon',price:450,rating:'4.9',icon:'♡',color:'gold',desc:'Custom cakes and dessert tables made with love.'}]
};
let state;
try{state=JSON.parse(localStorage.getItem('everly-state'))||JSON.parse(JSON.stringify(defaults))}catch(e){state=JSON.parse(JSON.stringify(defaults))}
if(!state.weddingDate)state.weddingDate='2027-09-18';
if(!Array.isArray(state.favorites))state.favorites=[];
if(!Array.isArray(state.guests))state.guests=[];
let currentPage='dashboard',vendorFilter='All',searchText='';
const money=n=>'$'+Number(n||0).toLocaleString('en-US',{maximumFractionDigits:0});
function formatWeddingDate(value){const d=new Date(value+'T12:00:00');return Number.isNaN(d.getTime())?'Set wedding date':d.toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});}
function validWeddingDate(value){if(!/^\d{4}-\d{2}-\d{2}$/.test(value))return false;const d=new Date(value+'T12:00:00');return !Number.isNaN(d.getTime())&&d.getFullYear()===Number(value.slice(0,4))&&d.getMonth()+1===Number(value.slice(5,7))&&d.getDate()===Number(value.slice(8,10));}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){localStorage.setItem('everly-state',JSON.stringify(state))}
function toast(msg){let t=document.getElementById('toast');t.textContent=msg;t.style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.style.display='none',2400)}
function completed(){return state.tasks.filter(t=>t.done).length}
function totalPlanned(){return state.categories.reduce((s,c)=>s+Number(c.planned||0),0)}
function totalActual(){return state.categories.reduce((s,c)=>s+Number(c.actual||0),0)}
function progressBar(n){return '<div class="progress"><span style="width:'+Math.min(100,n)+'%"></span></div>'}
function stat(label,num,foot,ico){return '<div class="card"><div class="stat-top"><span>'+label+'</span><span class="stat-icon">'+ico+'</span></div><div class="stat-num">'+num+'</div><div class="stat-foot">'+foot+'</div></div>'}
function taskHtml(t,i){return '<div class="task '+(t.done?'done':'')+'"><input class="check task-check" type="checkbox" data-index="'+i+'" '+(t.done?'checked':'')+'><div style="min-width:0"><div class="task-name">'+esc(t.name)+'</div><div class="task-meta">'+esc(t.meta)+'</div></div><span class="task-tag '+(t.done?'done-tag':'')+'">'+(t.done?'Done':esc(t.tag))+'</span></div>'}
function vendorHtml(v){const photos={'Venue':'https://images.unsplash.com/photo-1519167758481-83f550bb49b3?auto=format&fit=crop&w=1000&q=80','Photography':'https://images.unsplash.com/photo-1511285560929-80b456fea0bc?auto=format&fit=crop&w=1000&q=80','Florist & decor':'https://images.unsplash.com/photo-1490750967868-88aa4486c946?auto=format&fit=crop&w=1000&q=80','Music':'https://images.unsplash.com/photo-1501386761578-eac5c94b800a?auto=format&fit=crop&w=1000&q=80','Bridal attire':'https://images.unsplash.com/photo-1594552072238-b8a33785b7cd?auto=format&fit=crop&w=1000&q=80','Cake & desserts':'https://images.unsplash.com/photo-1535254973040-607b474cb50d?auto=format&fit=crop&w=1000&q=80'};const photo=photos[v.type]||photos['Venue'];const saved=state.favorites.includes(v.name);return '<article class="card vendor-card"><div class="vendor-photo '+v.color+'" style="background-image:url('+photo+')"><span class="photo-fallback">'+v.icon+'</span><button class="favorite-btn '+(saved?'saved':'')+'" data-favorite="'+esc(v.name)+'" aria-label="'+(saved?'Remove '+esc(v.name)+' from favorites':'Save '+esc(v.name)+' to favorites')+'">'+(saved?'♥':'♡')+'</button></div><div class="vendor-body"><div class="vendor-type">'+esc(v.type)+'</div><div class="vendor-name">'+esc(v.name)+'</div><div class="vendor-location">⌖ '+esc(v.location)+'</div><div class="vendor-bottom"><span class="price">From '+money(v.price)+'</span><span class="rating">★ '+v.rating+'</span></div><p class="sub vendor-desc">'+esc(v.desc)+'</p><button class="btn btn-light vendor-contact" data-name="'+esc(v.name)+'">View vendor <span>↗</span></button></div></article>'}
function dashboard(){
let p=totalPlanned(),done=completed(),pct=state.tasks.length?Math.round(done/state.tasks.length*100):0;
const days=Math.max(0,Math.ceil((new Date(state.weddingDate+'T00:00:00')-new Date(new Date().toDateString()))/86400000));
const nextTask=state.tasks.find(t=>!t.done);
const categories=[['Venues','Venue','⌂','cat-venue'],['Photography','Photography','◎','cat-photo'],['Florists','Florist & decor','✿','cat-flower'],['Bridal wear','Bridal attire','✧','cat-bridal'],['Music','Music','♫','cat-music'],['Cakes','Cake & desserts','♡','cat-cake']];
return '<section class="welcome-panel"><div class="welcome-copy"><span class="eyebrow">A LITTLE MAGIC IS ON THE WAY</span><h1 class="h1">Your forever starts<br><em>with a beautiful plan.</em></h1><p class="sub">One day, a thousand little moments. Let’s make them yours.</p><div class="welcome-actions"><button class="btn btn-primary" data-go="checklist">Continue planning <span>↗</span></button><button class="text-action" data-go="vendors">Find your dream vendors →</button></div></div><div class="countdown-card"><span class="countdown-label">COUNTING DOWN TO YOUR DAY</span><strong class="countdown-number">'+days+'</strong><span class="countdown-days">days to go</span><span class="countdown-date">'+esc(formatWeddingDate(state.weddingDate).toUpperCase())+'</span><span class="countdown-flower">✳</span></div></section><section class="next-step"><div class="next-step-icon">✦</div><div class="next-step-copy"><span class="eyebrow">YOUR NEXT LITTLE STEP</span><strong>'+(nextTask?esc(nextTask.name):'You’ve checked everything off!')+'</strong><span>'+(nextTask?esc(nextTask.meta):'Take a moment to celebrate your progress.')+'</span></div><div class="mini-progress"><div class="mini-progress-track"><span style="width:'+pct+'%"></span></div><small>'+done+' of '+state.tasks.length+' tasks done</small></div><button class="round-arrow" data-go="checklist" aria-label="Open checklist">↗</button></section><section class="browse-section"><div class="section-heading"><div><div class="eyebrow">THE DREAM TEAM</div><h2 class="section-title">Find your kind of magic.</h2><p class="sub">Beautiful people for your most beautiful day.</p></div><button class="small-link" data-go="vendors">See all vendors ↗</button></div><div class="category-grid">'+categories.map(c=>'<button class="category-tile '+c[3]+'" data-filter="'+c[1]+'" data-go="vendors"><span class="category-icon">'+c[2]+'</span><span class="category-name">'+c[0]+'</span><span class="category-arrow">↗</span></button>').join('')+'</div></section><section class="featured-section"><div class="section-heading"><div><div class="eyebrow">A FEW LOVELY FINDS</div><h2 class="section-title">Worth falling in love with.</h2></div><button class="small-link" data-go="vendors">Discover more →</button></div><div class="grid vendor-grid featured-vendors">'+state.vendors.slice(0,3).map(vendorHtml).join('')+'</div><p class="page-note">Vendor names, ratings and prices are illustrative demo content, not verified listings.</p></section><section class="planning-cards"><button class="planning-card budget-teaser" data-go="budget"><span class="planning-card-art">◈</span><span class="eyebrow">THE PRACTICAL MAGIC</span><strong>Your wedding budget</strong><span class="planning-card-detail">'+money(state.budget)+' to make it happen</span><span class="planning-card-link">Take a look ↗</span></button><button class="planning-card guest-teaser" data-go="guests"><span class="planning-card-art">♡</span><span class="eyebrow">YOUR FAVORITE PEOPLE</span><strong>Gather your people</strong><span class="planning-card-detail">'+(state.guests||[]).length+' guests on your list</span><span class="planning-card-link">View guest list ↗</span></button></section><div class="home-footnote">Made for your forever. <span>♡</span> Your plans are saved in this browser.</div>';
}
function budgetPage(){let p=totalPlanned(),a=totalActual();return '<div class="heading-row"><div><div class="eyebrow">Make every moment count</div><h1 class="h1">Your wedding budget</h1><div class="sub">A clear view of your spending, from the big things to the little details.</div></div><button class="btn btn-primary" id="saveBudget">✓ &nbsp; Save changes</button></div><div class="grid stats">'+stat('Total budget',money(state.budget),'Your overall spending limit','◈')+stat('Planned expenses',money(p),Math.round(p/Math.max(state.budget,1)*100)+'% allocated','↗')+stat('Actual spending',money(a),'Expenses you’ve entered','✓')+stat('Remaining',money(state.budget-a),a>state.budget?'Over budget':'Available to spend',a>state.budget?'!':'＋')+'</div><div class="card"><div class="card-head"><div><h3 class="card-title">Budget breakdown</h3><div class="sub" style="margin-top:5px">Change planned amounts and record what you’ve spent.</div></div></div><div class="form-grid" style="max-width:600px;margin-bottom:20px"><div class="field"><label>Total wedding budget (USD)</label><input id="totalBudget" type="number" min="0" value="'+state.budget+'"></div></div><div class="table-wrap"><table class="budget-table"><thead><tr><th>Category</th><th>Planned ($)</th><th>Actual ($)</th><th>Difference</th></tr></thead><tbody>'+state.categories.map((c,i)=>'<tr><td><span class="dot" style="background:'+c.color+';margin-right:8px"></span>'+esc(c.name)+'</td><td><input type="number" min="0" class="planned-input" data-index="'+i+'" value="'+c.planned+'"></td><td><input type="number" min="0" class="actual-input" data-index="'+i+'" value="'+c.actual+'"></td><td style="font-weight:700;color:'+(Number(c.planned)-Number(c.actual)<0?'#b26a53':'#4d7a5d')+'">'+money(Number(c.planned)-Number(c.actual))+'</td></tr>').join('')+'</tbody><tfoot><tr><td><strong>Total</strong></td><td><strong>'+money(p)+'</strong></td><td><strong>'+money(a)+'</strong></td><td><strong>'+money(p-a)+'</strong></td></tr></tfoot></table></div><p class="page-note">All amounts are in USD. Your changes are saved in this browser only.</p></div>'}
function checklistPage(){return '<div class="heading-row"><div><div class="eyebrow">One step at a time</div><h1 class="h1">Wedding checklist</h1><div class="sub">All the little things that make your day unforgettable.</div></div><button class="btn btn-primary" id="addTask">＋ &nbsp; Add a task</button></div><div class="grid stats">'+stat('Tasks completed',completed()+' / '+state.tasks.length,'Your progress so far','✓')+stat('Still to do',state.tasks.length-completed(),'Every step brings you closer','◷')+'</div><div class="card"><div class="card-head"><h3 class="card-title">Your planning timeline</h3><span class="task-tag done-tag">'+Math.round((state.tasks.length?completed()/state.tasks.length:0)*100)+'% complete</span></div><div class="progress-row"><span>Wedding preparations</span><strong>'+completed()+' of '+state.tasks.length+'</strong></div>'+progressBar((state.tasks.length?completed()/state.tasks.length:0)*100)+'<div class="timeline" style="margin-top:12px">'+state.tasks.map(taskHtml).join('')+'</div><p class="page-note">Tick a task to mark it complete. Your checklist is saved in this browser.</p></div>'}
function vendorsPage(){let cats=['All','Venue','Photography','Florist & decor','Music','Bridal attire','Cake & desserts','Favorites'];let list=state.vendors.filter(v=>(vendorFilter==='All'||(vendorFilter==='Favorites'?state.favorites.includes(v.name):v.type===vendorFilter))&&(v.name+' '+v.type+' '+v.location).toLowerCase().includes(searchText.toLowerCase()));return '<div class="heading-row"><div><div class="eyebrow">Meet your dream team</div><h1 class="h1">Wonderful people, one big day.</h1><div class="sub">Explore sample wedding vendors across Lebanon. Find the right fit for your celebration.</div></div></div><div class="field" style="max-width:460px;margin-bottom:18px"><input id="vendorSearch" placeholder="Search vendors, categories, locations…" value="'+esc(searchText)+'"></div><div class="filter-row">'+cats.map(c=>'<button class="filter '+(vendorFilter===c?'active':'')+'" data-filter="'+esc(c)+'">'+esc(c)+'</button>').join('')+'</div><div class="grid vendor-grid">'+(list.length?list.map(vendorHtml).join(''):'<div class="card empty">'+(vendorFilter==='Favorites'?'No saved vendors yet. Tap the heart on a vendor to save it here.':'No vendors match your search. Try another category.')+'</div>')+'</div><p class="page-note">Vendor names, ratings and prices are illustrative demo content, not verified listings.</p>'}
function guestsPage(){let guests=state.guests||[];return '<div class="heading-row"><div><div class="eyebrow">The people who make it special</div><h1 class="h1">Your guest list</h1><div class="sub">Keep your loved ones and their RSVPs organized in one place.</div></div><button class="btn btn-primary" id="addGuest">＋ &nbsp; Add guest</button></div><div class="grid stats">'+stat('Guest list',guests.length,'People invited or to invite','♧')+stat('Confirmed',guests.filter(g=>g.rsvp==='Yes').length,'Can’t wait to celebrate','✓')+stat('Awaiting reply',guests.filter(g=>g.rsvp==='Pending').length,'Follow up when ready','◷')+stat('Declined',guests.filter(g=>g.rsvp==='No').length,'Unable to attend','–')+'</div><div class="card"><div class="card-head"><h3 class="card-title">Your people</h3></div>'+(guests.length?'<div class="table-wrap"><table class="budget-table"><thead><tr><th>Name</th><th>Group</th><th>RSVP</th><th></th></tr></thead><tbody>'+guests.map((g,i)=>'<tr><td><strong>'+esc(g.name)+'</strong></td><td>'+esc(g.group)+'</td><td><select class="rsvp-select" data-index="'+i+'">'+['Pending','Yes','No'].map(o=>'<option '+(g.rsvp===o?'selected':'')+'>'+o+'</option>').join('')+'</select></td><td><button class="small-link remove-guest" data-index="'+i+'">Remove</button></td></tr>').join('')+'</tbody></table></div>':'<div class="empty"><div style="font-size:28px;margin-bottom:10px">♧</div><strong>Your guest list starts here</strong><p>Add family and friends, then track their RSVPs.</p></div>')+'</div><p class="page-note">Guest details are stored locally in this browser.</p>'}
function render(){let pages={dashboard:dashboard,budget:budgetPage,checklist:checklistPage,vendors:vendorsPage,guests:guestsPage};document.getElementById('content').innerHTML=pages[currentPage]();const dateLabel=document.getElementById('weddingDateLabel');if(dateLabel)dateLabel.textContent=formatWeddingDate(state.weddingDate);document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===currentPage));}
document.addEventListener('click',e=>{
if(e.target.closest('#weddingDateButton')){const value=prompt('Enter your wedding date (YYYY-MM-DD)',state.weddingDate);if(value===null)return;const date=value.trim();if(!validWeddingDate(date)){toast('Please enter a valid date as YYYY-MM-DD');return}state.weddingDate=date;save();render();toast('Wedding date updated');return}
const nav=e.target.closest('[data-page]');if(nav){currentPage=nav.dataset.page;render();return}
const go=e.target.closest('[data-go]');if(go){if(go.dataset.go==='vendors'&&go.dataset.filter)vendorFilter=go.dataset.filter;currentPage=go.dataset.go;render();return}
const filter=e.target.closest('[data-filter]');if(filter){vendorFilter=filter.dataset.filter;render();return}
const favorite=e.target.closest('[data-favorite]');if(favorite){const name=favorite.dataset.favorite;if(state.favorites.includes(name))state.favorites=state.favorites.filter(n=>n!==name);else state.favorites.push(name);save();render();toast(state.favorites.includes(name)?'Added to favorites':'Removed from favorites');return}
const contact=e.target.closest('.vendor-contact');if(contact){const v=state.vendors.find(x=>x.name===contact.dataset.name);if(!v)return;const photos={'Venue':'https://images.unsplash.com/photo-1519167758481-83f550bb49b3?auto=format&fit=crop&w=1000&q=80','Photography':'https://images.unsplash.com/photo-1511285560929-80b456fea0bc?auto=format&fit=crop&w=1000&q=80','Florist & decor':'https://images.unsplash.com/photo-1490750967868-88aa4486c946?auto=format&fit=crop&w=1000&q=80','Music':'https://images.unsplash.com/photo-1501386761578-eac5c94b800a?auto=format&fit=crop&w=1000&q=80','Bridal attire':'https://images.unsplash.com/photo-1594552072238-b8a33785b7cd?auto=format&fit=crop&w=1000&q=80','Cake & desserts':'https://images.unsplash.com/photo-1535254973040-607b474cb50d?auto=format&fit=crop&w=1000&q=80'};const saved=state.favorites.includes(v.name);document.getElementById('content').insertAdjacentHTML('beforeend','<div class="vendor-modal-backdrop" id="vendorModal"><section class="vendor-modal" role="dialog" aria-modal="true" aria-labelledby="vendorModalTitle"><button class="vendor-modal-close" aria-label="Close vendor details">×</button><div class="vendor-modal-image" style="background-image:url('+photos[v.type]+')"></div><div class="vendor-modal-content"><span class="eyebrow">A LITTLE MORE ABOUT THEM</span><h2 id="vendorModalTitle">'+esc(v.name)+'</h2><div class="vendor-modal-meta"><span>'+esc(v.type)+'</span><span>★ '+esc(v.rating)+'</span></div><p class="vendor-modal-location">⌖ '+esc(v.location)+'</p><p class="vendor-modal-description">'+esc(v.desc)+'</p><div class="vendor-modal-price"><span>Indicative starting price</span><strong>'+money(v.price)+'</strong></div><div class="vendor-modal-notice">Sample profile for the Everly prototype. This listing, rating and price have not been verified. Vendor messaging and booking will be added later.</div><div class="vendor-modal-actions"><button class="btn btn-light" data-favorite="'+esc(v.name)+'">'+(saved?'♥ Saved to favorites':'♡ Save to favorites')+'</button><button class="btn btn-primary vendor-modal-close">Close profile</button></div></div></section></div>');return}
const modalClose=e.target.closest('.vendor-modal-close');if(modalClose){document.getElementById('vendorModal')?.remove();return}
if(e.target.id==='vendorModal'){e.target.remove();return}

if(e.target.id==='saveBudget'){let total=document.getElementById('totalBudget');state.budget=Math.max(0,Number(total.value)||0);document.querySelectorAll('.planned-input').forEach(x=>state.categories[Number(x.dataset.index)].planned=Math.max(0,Number(x.value)||0));document.querySelectorAll('.actual-input').forEach(x=>state.categories[Number(x.dataset.index)].actual=Math.max(0,Number(x.value)||0));save();render();toast('Budget changes saved');return}
if(e.target.id==='addTask'){let name=prompt('What would you like to add to your checklist?');if(name&&name.trim()){state.tasks.push({name:name.trim(),meta:'Personal task',done:false,tag:'Upcoming'});save();render();toast('Task added');}return}
if(e.target.id==='addGuest'){let name=prompt('Guest full name');if(!name||!name.trim())return;let group=prompt('Group (e.g. Family, Friends)', 'Friends')||'Friends';if(!state.guests)state.guests=[];state.guests.push({name:name.trim(),group:group,rsvp:'Pending'});save();render();toast('Guest added');return}
const rm=e.target.closest('.remove-guest');if(rm){if(confirm('Remove this guest?')){state.guests.splice(Number(rm.dataset.index),1);save();render()}return}
});
document.addEventListener('change',e=>{if(e.target.matches('.task-check')){state.tasks[Number(e.target.dataset.index)].done=e.target.checked;save();render()}if(e.target.matches('.rsvp-select')){state.guests[Number(e.target.dataset.index)].rsvp=e.target.value;save();render();toast('RSVP updated')}});
document.addEventListener('input',e=>{if(e.target.id==='vendorSearch'){searchText=e.target.value;let pos=e.target.selectionStart;render();let input=document.getElementById('vendorSearch');input.focus();input.setSelectionRange(pos,pos)}});
render();
</script></body></html>
