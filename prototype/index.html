document.addEventListener('input',e=>{if(e.target.id==='vendorSearch'||e.target.id==='guestSearch'){if(e.target.id==='vendorSearch')searchText=e.target.value;else guestSearch=e.target.value;let id=e.target.id,pos=e.target.selectionStart;render();let input=document.getElementById(id);if(input){input.focus();input.setSelectionRange(pos,pos)}}});

function accountStatus(message,isError=false){const el=document.getElementById('accountMessage');if(el){el.textContent=message||'';el.classList.toggle('error',!!isError)}}
let recoveryPending=false;
function showPasswordRecovery(){recoveryPending=true;const m=document.getElementById("accountModal");m.hidden=false;document.body.classList.add("account-open");document.getElementById("accountTitle").textContent="Choose a new password";document.querySelector(".account-copy").textContent="Create a new password for your Everly account. Use at least 8 characters.";document.getElementById("accountForm").hidden=true;document.getElementById("forgotPasswordButton").hidden=true;document.getElementById("resetRequestForm").hidden=true;document.getElementById("accountMode").hidden=true;document.getElementById("accountSignout").hidden=true;document.getElementById("recoveryForm").hidden=false;accountStatus("Enter and confirm your new password.");}
function showAccount(){const m=document.getElementById('accountModal');if(!m)return;if(recoveryPending){showPasswordRecovery();return}document.getElementById("resetRequestForm").hidden=true;document.getElementById("recoveryForm").hidden=true;document.getElementById("forgotPasswordButton").hidden=!!currentUser;m.hidden=false;document.body.classList.add('account-open');accountStatus('');if(currentUser){document.getElementById('accountTitle').textContent='Your Everly account';document.querySelector('.account-copy').textContent='You are signed in. Your wedding plan is backed up to your private cloud workspace.';document.getElementById('accountForm').hidden=true;document.getElementById('accountMode').hidden=true;document.getElementById('accountSignout').hidden=false;document.getElementById('accountMessage').textContent=currentUser.email||'Signed in';}else{document.getElementById('accountForm').hidden=false;document.getElementById('accountMode').hidden=false;document.getElementById('accountTitle').textContent=accountMode==='signup'?'Create your Everly account':'Save your plans with Everly';document.querySelector('.account-copy').textContent='Create an account to securely save your wedding plan and access it across devices.';document.getElementById('accountForm').hidden=false;document.getElementById('accountSubmit').textContent=accountMode==='signup'?'Create account':'Sign in';document.getElementById('accountMode').textContent=accountMode==='signup'?'Already have an account? Sign in':'New to Everly? Create an account';document.getElementById('accountSignout').hidden=true;}}
function hideAccount(){document.getElementById('accountModal').hidden=true;document.body.classList.remove('account-open')}
function setAccountUI(){const b=document.getElementById('accountButton'),a=document.getElementById('userAvatar');if(b)b.textContent=currentUser?'My account':'Sign in';if(a)a.textContent=currentUser?(currentUser.email||'E').slice(0,1).toUpperCase():'♡';if(b)b.title=currentUser?'Cloud sync enabled':'Sign in to back up your plans'}
async function syncPlannerToCloud(){if(!supabaseClient||!currentUser||!cloudWeddingId||!cloudReady)return;try{const payload={planner_data:state,wedding_date:state.weddingDate||null,title:state.weddingTitle||'Our Wedding',updated_at:new Date().toISOString()};const {error}=await supabaseClient.from('weddings').update(payload).eq('id',cloudWeddingId).eq('owner_id',currentUser.id);if(error)throw error;accountStatus('All changes saved to your private cloud workspace.')}catch(e){console.error('Everly cloud save failed',e);toast('Could not sync changes. Your data is still saved on this device.')}}
async function attachCloudWorkspace(user){currentUser=user;cloudReady=false;setAccountUI();try{const {data:rows,error}=await supabaseClient.from('weddings').select('id,planner_data,wedding_date,title').eq('owner_id',user.id).order('created_at',{ascending:true}).limit(1);if(error)throw error;let row=rows&&rows[0];if(row){const hasLocal=!!localStorage.getItem('everly-state');if(hasLocal){const loadCloud=confirm('A cloud wedding already exists. Choose OK to load the cloud plan on this device. Choose Cancel to keep this device’s local plan unchanged and sign out.');if(!loadCloud){await supabaseClient.auth.signOut();currentUser=null;cloudWeddingId=null;cloudReady=false;setAccountUI();toast('No plans were changed. You have been signed out.');return}}state={...JSON.parse(JSON.stringify(defaults)),...(row.planner_data||{})};if(row.wedding_date)state.weddingDate=row.wedding_date;localStorage.setItem('everly-state',JSON.stringify(state));render();cloudWeddingId=row.id;}else{const {data:newRow,error:insertError}=await supabaseClient.from('weddings').insert({owner_id:user.id,title:state.weddingTitle||'Our Wedding',wedding_date:state.weddingDate||null,planner_data:state}).select('id').single();if(insertError)throw insertError;cloudWeddingId=newRow.id}cloudReady=true;setAccountUI();accountStatus('Your wedding plan is securely connected.');toast('Everly cloud backup is enabled')}catch(e){console.error('Everly cloud setup failed',e);currentUser=null;cloudWeddingId=null;cloudReady=false;setAccountUI();toast('Cloud setup failed. Your local plan is safe.');showAccount();accountStatus(e.message||'Could not connect your plan to the cloud.',true)}}
async function initAccount(){if(!supabaseClient){document.getElementById('accountButton').disabled=true;document.getElementById('accountButton').title='Account service did not load';return}supabaseClient.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY'){showPasswordRecovery();return}if(event==='SIGNED_OUT'){currentUser=null;cloudWeddingId=null;cloudReady=false;setAccountUI()}else if(session?.user&&event==='SIGNED_IN'){setTimeout(()=>{if(currentUser?.id!==session.user.id)attachCloudWorkspace(session.user)},0)}});const recoveryHash=window.location.hash;const recoveryQuery=new URLSearchParams(window.location.search);const isRecovery=recoveryHash.includes('type=recovery')||recoveryHash==='#recovery'||recoveryQuery.get('type')==='recovery'||recoveryQuery.get('recovery')==='1';const {data:{session},error}=await supabaseClient.auth.getSession();if(error)console.warn('Could not restore auth session',error);if(isRecovery){if(session?.user)showPasswordRecovery();else accountStatus('This password-reset link is invalid or expired. Please request a new one.',true)}else if(session?.user){await attachCloudWorkspace(session.user)}setAccountUI()}
document.getElementById('forgotPasswordButton').addEventListener('click',()=>{document.getElementById('accountTitle').textContent='Reset your password';document.querySelector('.account-copy').textContent='Enter your account email and we will send you a secure password-reset link.';document.getElementById('accountForm').hidden=true;document.getElementById('forgotPasswordButton').hidden=true;document.getElementById('accountMode').hidden=true;document.getElementById('resetRequestForm').hidden=false;accountStatus('');const email=document.getElementById('accountEmail').value.trim();if(email)document.getElementById('resetEmail').value=email;});
document.getElementById('backToSignIn').addEventListener('click',()=>{document.getElementById('resetRequestForm').hidden=true;document.getElementById('accountForm').hidden=false;document.getElementById('forgotPasswordButton').hidden=false;document.getElementById('accountMode').hidden=false;document.getElementById('accountTitle').textContent='Save your plans with Everly';document.querySelector('.account-copy').textContent='Create an account to securely save your wedding plan and access it across devices.';accountStatus('');});
document.getElementById('resetRequestForm').addEventListener('submit',async e=>{e.preventDefault();const submit=document.getElementById('resetRequestSubmit');submit.disabled=true;accountStatus('Sending your reset link…');try{const email=document.getElementById('resetEmail').value.trim();const redirectTo=window.location.origin+window.location.pathname+'#recovery';const {error}=await supabaseClient.auth.resetPasswordForEmail(email,{redirectTo});if(error)throw error;accountStatus('If an account exists for that email, a password-reset link has been sent. Check your inbox.');}catch(err){accountStatus(err.message||'Could not send the reset email. Please try again.',true)}finally{submit.disabled=false}});
document.getElementById('recoveryForm').addEventListener('submit',async e=>{e.preventDefault();const password=document.getElementById('newPassword').value,confirmPassword=document.getElementById('confirmNewPassword').value,submit=document.getElementById('recoverySubmit');if(password.length<8){accountStatus('Your password must be at least 8 characters.',true);return}if(password!==confirmPassword){accountStatus('The passwords do not match.',true);return}submit.disabled=true;accountStatus('Updating your password…');try{const {data,error}=await supabaseClient.auth.updateUser({password});if(error)throw error;recoveryPending=false;document.getElementById('recoveryForm').hidden=true;document.getElementById('accountForm').hidden=true;accountStatus('Your password has been updated successfully.');if(data.user)await attachCloudWorkspace(data.user);toast('Password updated successfully');hideAccount();}catch(err){accountStatus(err.message||'Could not update your password. Please request a new reset link.',true)}finally{submit.disabled=false}});
document.getElementById('accountButton').addEventListener('click',showAccount);
document.getElementById('closeAccount').addEventListener('click',hideAccount);
document.getElementById('accountModal').addEventListener('click',e=>{if(e.target.id==='accountModal')hideAccount()});
document.getElementById('accountMode').addEventListener('click',()=>{accountMode=accountMode==='signup'?'signin':'signup';showAccount()});
document.getElementById('accountForm').addEventListener('submit',async e=>{e.preventDefault();if(!supabaseClient){accountStatus('Account service is unavailable. Refresh and try again.',true);return}const email=document.getElementById('accountEmail').value.trim(),password=document.getElementById('accountPassword').value,submit=document.getElementById('accountSubmit');submit.disabled=true;accountStatus(accountMode==='signup'?'Creating your account…':'Signing in…');try{if(accountMode==='signup'){const {data,error}=await supabaseClient.auth.signUp({email,password,options:{emailRedirectTo:'https://jrahme10.github.io/Everly/prototype/'}});if(error)throw error;if(data.session&&data.user){await attachCloudWorkspace(data.user);hideAccount()}else{accountStatus('Account created. Check your email to confirm it, then return here to sign in.')}}else{const {data,error}=await supabaseClient.auth.signInWithPassword({email,password});if(error)throw error;if(data.user){await attachCloudWorkspace(data.user);hideAccount()}}}catch(err){accountStatus(err.message||'Could not complete that request.',true)}finally{submit.disabled=false}});
document.getElementById('accountSignout').addEventListener('click',async()=>{if(!supabaseClient)return;const {error}=await supabaseClient.auth.signOut();if(error){accountStatus(error.message,true);return}hideAccount();toast('Signed out. Your local plan remains on this device.')});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!document.getElementById('accountModal').hidden)hideAccount()});
initAccount();
</script></body></html>
